[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iryax-agents"
version = "1.0.0"
description = "Iryax Multi-Product AI Agent Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anycode"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/anycode/agents/products"]
python_files = ["test_*.py", "*_test.py", "tests.py"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"